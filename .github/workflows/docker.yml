name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: slickdomi/speedtest-cli-otel
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # arm images are built under emulation on the x86 runner
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: slickdomi
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest on main, 1.2.3 and 1.2 on v1.2.3 tags
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # runs tests/smoke.py inside the image, once per platform
      - name: Test
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          platforms: ${{ env.PLATFORMS }}
          cache-from: type=gha

      # pull requests stop after the tests
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
